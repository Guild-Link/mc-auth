[package]
name = "minecraft-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
azalea-auth = "0.16"
base64 = "0.22"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
