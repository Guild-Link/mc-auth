<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minecraft Token Fetcher</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        box-sizing: border-box;
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100vh;
        max-width: 36rem;
        margin: 0 auto;
        padding: 0 1.25rem;
        background: #111;
        color: #eee;
      }
      main {
        align-self: center;
        padding: 1.5rem;
        border: 1px solid #333;
        border-radius: 8px;
        background: #191919;
      }
      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.4rem;
        text-align: center;
      }
      a {
        color: inherit;
      }
      button {
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 4px;
        background: #3c8527;
        color: inherit;
        cursor: pointer;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.75rem;
      }
      #code {
        margin: 1.25rem 0;
        font: 1.8rem monospace;
        letter-spacing: 0.12em;
      }
      #advanced,
      footer {
        color: #888;
        font-size: 0.75rem;
      }
      #advanced {
        margin-top: 0.75rem;
        cursor: pointer;
      }
      #key {
        padding: 0.5rem;
        border: 1px solid #333;
        border-radius: 4px;
        background: #111;
        color: #aaa;
        font: 0.75rem monospace;
      }
      footer {
        padding: 1rem 0;
        text-align: center;
      }
      #error {
        color: #ff8b8b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Minecraft Token Fetcher</h1>

      <section id="setup">
        <button id="start">Login With Microsoft</button>
        <details id="advanced">
          <summary>Encryption key</summary>
          <input id="key" spellcheck="false" autocomplete="off" />
        </details>
      </section>

      <section id="login" hidden>
        <p>
          Open
          <a id="link" target="_blank" rel="noreferrer">Microsoft sign-in</a>
          and enter:
        </p>
        <div id="code"></div>
        <p>Waiting for authentication...</p>
      </section>

      <section id="complete" hidden>
        <input id="token" readonly />
        <button id="copy">Copy</button>
      </section>

      <p id="error" hidden></p>
    </main>
    <footer>
      This page is not affiliated with Mojang/Microsoft/Minecraft.
    </footer>
    <script>
      const $ = (id) => document.getElementById(id);

      $("key").value = new URLSearchParams(location.search).get("key") ?? "";
      $("advanced").open = !$("key").value;

      $("start").onclick = async () => {
        $("setup").hidden = true;
        $("error").hidden = true;

        try {
          const start = await fetch("/start", {
            method: "POST",
            body: $("key").value,
          });

          if (!start.ok) throw new Error(await start.text());
          const auth = await start.json();

          const url = new URL(auth.verification_uri);
          url.searchParams.set("otc", auth.user_code);
          window.open(url, "_blank", "noopener");

          $("code").textContent = auth.user_code;
          $("login").hidden = false;
          $("link").href = url;

          let response;
          do {
            await new Promise((resolve) => setTimeout(resolve, 2000));
            response = await fetch("/status", {
              method: "POST",
              body: auth.session,
            });
          } while (response.status === 202);

          if (!response.ok) throw new Error(await response.text());

          $("token").value = await response.text();
          $("complete").hidden = false;
          $("login").hidden = true;
        } catch (e) {
          $("error").textContent = e.message;
          $("setup").hidden = false;
          $("error").hidden = false;
          $("login").hidden = true;
        }
      };

      $("copy").onclick = () => navigator.clipboard.writeText($("token").value);
    </script>
  </body>
</html>
